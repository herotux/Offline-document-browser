name: Windows build and installers

on:
  push:
    branches:
      - main
      - create-wpf-pdf-explorer
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - create-wpf-pdf-explorer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x64 app, MSI and EXE installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -match '^v?(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore UtilityDocuments.csproj

      - name: Publish self-contained x64 application
        run: >
          dotnet publish UtilityDocuments.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/publish

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet build Setup/setup.wixproj --configuration Release -p:PublishDir="$PWD\artifacts\publish\" -p:ProductVersion="${{ steps.version.outputs.value }}"

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build EXE installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { throw "NSIS compiler not found at $makensis" }
          & $makensis "/DPRODUCT_VERSION=${{ steps.version.outputs.value }}" "/DPUBLISH_DIR=$PWD\artifacts\publish" installer\utility-documents.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\publish\* -DestinationPath "artifacts\UtilityDocuments-portable-x64.zip" -Force

      - name: Verify outputs
        shell: pwsh
        run: |
          $expected = @(
            "Setup\bin\Release\en-us\Utility Documents.msi",
            "artifacts\UtilityDocuments-Setup-${{ steps.version.outputs.value }}-x64.exe",
            "artifacts\UtilityDocuments-portable-x64.zip"
          )
          Get-ChildItem -Path Setup\bin\Release -Recurse -Filter *.msi | ForEach-Object { Write-Host "MSI: $($_.FullName)" }
          if (!(Get-ChildItem Setup\bin\Release -Recurse -Filter *.msi)) { throw "MSI output was not produced" }
          if (!(Test-Path "artifacts\UtilityDocuments-Setup-${{ steps.version.outputs.value }}-x64.exe")) { throw "NSIS installer was not produced" }
          if (!(Test-Path "artifacts\UtilityDocuments-portable-x64.zip")) { throw "Portable ZIP was not produced" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utility-documents-windows-x64
          path: |
            Setup/bin/Release/**/*.msi
            artifacts/UtilityDocuments-Setup-*-x64.exe
            artifacts/UtilityDocuments-portable-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: utility-documents-windows-x64
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.zip
